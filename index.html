let step=0;function start(m){mode=m;step=0;let p=pool();if(m==='wrong')p=p.filter(w=>stats[w.id]?.wrong);queue=sh(p.flatMap(w=>{let kinds=m==='vocab'?[0,1]:m==='context'||m==='wrong'?[2,3,4]:m==='mixed'?[0,2,3,4]:[];return kinds.map(k=>({w,k}))}));if(m==='decoder')queue=sh(dec.map((d,i)=>({d,i})));if(m==='reading')queue=sh(special.filter(s=>!theme||s.t===theme));if(m==='same')queue=sh(pool().map(w=>({w,k:4})));if(m==='visual'){queue=[];if(theme!==2)queue.push(...[['library','Where can you read books?'],['lab','Where do students do experiments?'],['canteen','Where can you buy a sandwich?'],['sports','Where can you play basketball?'],['office','Where can you talk to the headmaster?'],['hall','Where can you watch a school performance?'],['lunch','Where can you eat lunch?'],['gate','Where do you enter the school?']].map(([a,q])=>({q,a,p:'Choose the correct place.',o:sh(['library','lab','canteen','sports','office','hall','lunch','gate'].filter(v=>v!==a)).slice(0,2),e:({library:'Library',lab:'Science lab',canteen:'Canteen',sports:'Sports field',office:"Headmaster’s office",hall:'Conference hall',lunch:'Lunch hall',gate:'School gate'})[a],picture:true}))); if(theme!==1)for(let h=1;h<=12;h++)for(let min of [0,15,30,45])queue.push({h,min});if(theme!==2)queue.push(...[{t:1,p:'🇯🇵',q:'Which country?',o:['Japan','France','Brazil'],a:'Japan',e:'Japonya'},{t:1,p:'🇹🇷',q:'Which country?',o:['Türkiye','Spain','Canada'],a:'Türkiye',e:'Türkiye'}]);if(theme!==1)queue.push({p:'<table><tr><th>Monday</th><th>Tuesday</th></tr><tr><td>09:00 Maths</td><td>09:00 English</td></tr><tr><td>10:15 Science</td><td>10:15 Art</td></tr></table>',q:'When is Science?',o:['Monday','Tuesday','Friday'],a:'Monday',e:'Science pazartesi günü.'});queue=sh(queue)}if(!queue.length){app.innerHTML='<div class="card">Bu bölümde şu anda soru yok. <button onclick="menu()">Geri dön</button></div>';return}next()}
function next(){if(!queue.length){app.innerHTML=`<div class="card"><h2>🎉 Great job!</h2>${step} soru tamamlandı.<p><button onclick="menu()">Menüye dön</button></p></div>`;return}let x=queue.shift();answered=false;let p='',q='',o=[],a='',e='',w=x.w;if(w){let others=sh(words.filter(z=>z.c===w.c&&z.w!==w.w&&z.tr!==w.tr));if(others.length<2)others=sh(words.filter(z=>z.t===w.t&&z.w!==w.w&&z.tr!==w.tr));let wrong=others.slice(0,2);let sentence=(x.k===3?w.b:w.a);if(x.k===0){q=w.w+' ne demek?';a=w.tr;o=wrong.map(z=>z.tr)}else if(x.k===1){q=w.tr+' İngilizcede nasıl söylenir?';a=w.w;o=wrong.map(z=>z.w)}else if(x.k===4){p=esc(w.b.replace('~',w.w)).replace(esc(w.w),'<mark>'+esc(w.w)+'</mark>');q='Renkli kelime bu cümlede ne anlama geliyor?';a=w.tr;o=wrong.map(z=>z.tr)}else{p=esc(sentence.replace('~','_____'));q='Complete the sentence.';a=w.w;o=wrong.map(z=>z.w)}e=w.w+' = '+w.tr+' · '+sentence.replace('~',w.w)}else if(x.d){q=x.d[0]+' neyi sorar / ne anlama gelir?';a=x.d[1];o=sh(dec.filter(z=>z!==x.d)).slice(0,2).map(z=>z[1]);e=x.d[2]}else if(x.h){let H=x.h,M=x.min;let line=(angle,len,width)=>`<line x1="80" y1="80" x2="${80+Math.sin(angle)*len}" y2="${80-Math.cos(angle)*len}" stroke="#263b70" stroke-width="${width}" stroke-linecap="round"/>`;p=`<svg width="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="75" fill="#fff4d8" stroke="#526dbe" stroke-width="3"/>${Array.from({length:12},(_,i)=>`<text x="${80+Math.sin((i+1)*Math.PI/6)*60}" y="${85-Math.cos((i+1)*Math.PI/6)*60}" text-anchor="middle" font-size="12">${i+1}</text>`).join('')}${line((H+M/60)*Math.PI/6,35,5)}${line(M*Math.PI/30,50,3)}</svg>`;q='What time is it?';let fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;a=fmt(H,M);o=[fmt(H,(M+15)%60),fmt(H%12+1,M)];e=a}else{({p,q,o,a,e}=x);o=o.filter(v=>v!==a)}current={x,w,a,e};let opts=sh([...new Set([a,...o])]);app.innerHTML=`<div class="card"><div class="bar"><button onclick="menu()">← Menü</button><small>${step} tamamlandı · ${queue.length+1} kaldı</small></div><progress value="${step}" max="${step+queue.length+1}"></progress><p style="font-size:21px">${p}</p><h3>${esc(q)}</h3><div id="opts">${opts.map((v,i)=>`<button class="opt" data-i="${i}">${x.picture?scene(v):esc(v)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`;document.querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>answer(b,opts[i]));}
function answer(b,v){if(answered)return;let {w,a,e,x}=current;let s=w?(stats[w.id]??={contexts:[],wrong:false}):null;if(v!==a){b.classList.add('bad');if(s){s.wrong=true;current.hadWrong=true;save()}document.querySelector('#feedback').textContent='Try again! Cümleyi ve seçenekleri tekrar oku.';return}answered=true;step++;b.classList.add('good');if(s){if(!current.hadWrong&&[2,3,4].includes(x.k)&&!s.contexts.includes(x.k))s.contexts.push(x.k);if(!current.hadWrong)s.wrong=false;else queue.push({w,k:x.k===2?3:2});save()}document.querySelector('#feedback').innerHTML=`<p>🎉 Excellent! ${esc(e)}</p><button onclick="next()">Next Question →</button>`;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<22;i++){let el=document.createElement('span');el.className='conf';el.style.left=Math.random()*100+'vw';el.style.color=['#e27454','#476ad0','#27a77b'][i%3];el.textContent='✦';document.body.append(el);setTimeout(()=>el.remove(),1100)}}home();</script></html>
