  piece.style.setProperty('--popdelay',(1.15+(i%4)*.14)+'s');
  layer.append(piece);
 }
 document.body.append(layer);setTimeout(()=>layer.remove(),3000);
}
</script><style id="sound-v5-style">

<script id="feedback-sound-v5">
let soundEnabled=true;
try{soundEnabled=localStorage.getItem('englishAdventureSound')!=='off'}catch(e){}
const soundToggle=document.getElementById('soundToggle');
function updateSoundButton(){soundToggle.textContent=soundEnabled?'🔊 Ses açık':'🔇 Ses kapalı';soundToggle.setAttribute('aria-pressed',String(soundEnabled))}
updateSoundButton();
soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('englishAdventureSound',soundEnabled?'on':'off')}catch(e){}updateSoundButton()});
let audioCtx;
function getAudio(){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return null;audioCtx??=new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
function tone(ctx,when,freq,endFreq,duration,type='sine',volume=.12){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,when);osc.frequency.exponentialRampToValueAtTime(Math.max(40,endFreq),when+duration);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.012);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain).connect(ctx.destination);osc.start(when);osc.stop(when+duration+.02)}
function clap(ctx,when,volume=.15){const len=Math.floor(ctx.sampleRate*.11),buffer=ctx.createBuffer(1,len,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const noise=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();noise.buffer=buffer;filter.type='highpass';filter.frequency.value=850;gain.gain.setValueAtTime(volume,when);gain.gain.exponentialRampToValueAtTime(.0001,when+.11);noise.connect(filter).connect(gain).connect(ctx.destination);noise.start(when);noise.stop(when+.11)}
function playFeedbackSound(kind){if(!soundEnabled)return;try{const ctx=getAudio();if(!ctx)return;const t=ctx.currentTime+.025;if(kind==='correct'){// A short applause-like burst followed by a cheerful two-note chime.
for(let i=0;i<15;i++)clap(ctx,t+i*.047+Math.random()*.022,.065+Math.random()*.055);
tone(ctx,t+.12,660,740,.15,'sine',.045);tone(ctx,t+.35,880,990,.22,'sine',.065);
}else{// Gentle, playful 'oops' sound; not startling.
tone(ctx,t,390,255,.22,'triangle',.10);tone(ctx,t+.20,330,210,.27,'sine',.09);
}}catch(e){}}
</script>

<button id="teacherLaunch" onclick="teacherOpen()">⚙️ Öğretmen paneli</button>
<div id="teacherModal" role="dialog" aria-modal="true" aria-label="Öğretmen paneli"><div id="teacherPane"><button class="light" onclick="teacherClose()">✕ Kapat</button><h2>👩‍🏫 English Adventure — Öğretmen Paneli</h2><div id="teacherBody"></div></div></div>
<script id="teacher-v16-script">
const EA_PROJECT='https://gcqbuyipildgsgsqmypx.supabase.co';
// Insert the public sb_publishable_ key once in this file before publishing to GitHub Pages.
const EA_PUBLIC_KEY='PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';
const eaReady=EA_PUBLIC_KEY.startsWith('sb_publishable_')||EA_PUBLIC_KEY.startsWith('eyJ');
let eaToken='',eaRefresh='',eaRows=[];
const eaEl=()=>document.querySelector('#teacherBody');
const eaEscape=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function teacherOpen(){document.querySelector('#teacherModal').classList.add('open');teacherRender()}
function teacherClose(){document.querySelector('#teacherModal').classList.remove('open')}
function eaStatus(msg){const e=document.querySelector('#eaStatus');if(e)e.textContent=msg}
async function eaRequest(path,options={}){
 const headers={'apikey':EA_PUBLIC_KEY,...options.headers};if(eaToken)headers.Authorization='Bearer '+eaToken;
 const res=await fetch(EA_PROJECT+path,{...options,headers});const body=await res.text();let data;try{data=body?JSON.parse(body):null}catch{data=body}
 if(!res.ok)throw Error((data&& (data.message||data.error_description||data.error))||('HTTP '+res.status));return data;
}
async function eaLoad(){if(!eaReady)return;try{const data=await eaRequest('/rest/v1/Vocabulary?select=*&published=eq.true&order=id.asc');mergeRemote(data)}catch(e){console.warn('Vocabulary sync:',e.message)}}
async function eaLogin(ev){ev.preventDefault();try{eaStatus('Giriş yapılıyor…');const email=document.querySelector('#eaEmail').value.trim(),password=document.querySelector('#eaPassword').value;
 const res=await eaRequest('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});eaToken=res.access_token;eaRefresh=res.refresh_token;document.querySelector('#eaPassword').value='';await eaList();teacherRender()}catch(e){eaStatus('Giriş yapılamadı: '+e.message)}}
async function eaRefreshSession(){if(!eaRefresh)return false;try{const r=await eaRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:eaRefresh})});eaToken=r.access_token;eaRefresh=r.refresh_token;return true}catch{return false}}
async function eaList(){try{eaRows=await eaRequest('/rest/v1/Vocabulary?select=*&order=id.desc');return true}catch(e){eaStatus('Kelime listesi açılamadı: '+e.message+'\nÖğretmen yetkisini ve RLS kurallarını kontrol edin.');return false}}
function teacherRender(){if(!eaReady){eaEl().innerHTML='<p>Bu sürümde Supabase bağlantısı için <code>EA_PUBLIC_KEY</code> alanına projenin <b>publishable key</b> değeri eklenmelidir. <b>Secret/service_role anahtarı kullanılmaz.</b></p><p>Öğrenci uygulaması mevcut V15 kelimeleriyle çalışmaya devam eder.</p>';return}
 if(!eaToken){eaEl().innerHTML=`<p>Yalnızca öğretmen hesabınızla giriş yapın. Öğrenciler giriş yapmaz.</p><form onsubmit="eaLogin(event)"><label>E-posta</label><input id="eaEmail" type="email" required autocomplete="username"><label>Şifre</label><input id="eaPassword" type="password" required autocomplete="current-password"><button type="submit">Giriş yap</button></form><div id="eaStatus" class="status"></div>`;return}
 eaEl().innerHTML=`<p>Yeni kelimeleri taslak kaydedebilir veya yayınlayabilirsiniz. Yayınlananlar öğrencilerde birkaç dakika içinde görünür.</p><button class="light" onclick="eaLogout()">Çıkış yap</button><button class="light" onclick="eaList().then(teacherRender)">🔄 Listeyi yenile</button><div id="eaStatus" class="status"></div>
 <h3>➕ Kelime ekle / düzenle</h3><form id="eaForm" onsubmit="eaSave(event)"><input id="eaId" type="hidden"><div class="fields"><div><label>Tema</label><select id="eaTheme"><option value="1">1 — School Life</option><option value="2">2 — Classroom Life</option></select></div><div><label>Kategori</label><input id="eaCategory" required placeholder="School Objects"></div><div><label>İngilizce kelime</label><input id="eaWord" required></div><div><label>Türkçe anlamı</label><input id="eaMeaning" required></div></div><div class="fields"><div><label>Örnek 1 (kelime yerine ~ koyun)</label><input id="eaExample1" placeholder="I put my ~ on the desk."></div><div><label>Örnek 2 (kelime yerine ~ koyun)</label><input id="eaExample2" placeholder="Where is your ~?"></div></div><label><input id="eaPublished" type="checkbox" style="width:auto"> Öğrencilere yayınla</label><button type="submit">💾 Kaydet</button><button class="light" type="button" onclick="eaReset()">Yeni kayıt</button></form>
 <h3>📄 Toplu CSV yükle</h3><p class="hint">Sütunlar: theme,category,word,meaning,example_1,example_2,published. Excel'den CSV UTF-8 olarak kaydedebilirsiniz. İlk satır başlık olmalı. Önce taslak yüklemek daha güvenlidir.</p><input type="file" id="eaCsv" accept=".csv,text/csv"><button class="light" onclick="eaImport()">CSV dosyasını yükle</button><button class="light" onclick="eaTemplate()">Örnek CSV indir</button>
 <h3>📚 Veritabanındaki kelimeler (${eaRows.length})</h3><div id="eaList">${eaRows.slice(0,300).map(x=>`<div class="entry"><b>${eaEscape(x.word)}</b> — ${eaEscape(x.meaning)} <small>(${eaEscape(x.category)}, Tema ${x.theme})</small> ${x.published?'🟢 Yayında':'⚪ Taslak'}<div><button class="light" onclick="eaEdit(${x.id})">Düzenle</button><button class="danger" onclick="eaDelete(${x.id})">Sil</button></div></div>`).join('')||'<p>Henüz kelime eklenmedi.</p>'}</div>`;
}
function eaReset(){document.querySelector('#eaForm').reset();document.querySelector('#eaId').value=''}
async function eaSave(ev){ev.preventDefault();const id=document.querySelector('#eaId').value;const obj={theme:Number(document.querySelector('#eaTheme').value),category:document.querySelector('#eaCategory').value.trim(),word:document.querySelector('#eaWord').value.trim(),meaning:document.querySelector('#eaMeaning').value.trim(),example_1:document.querySelector('#eaExample1').value.trim(),example_2:document.querySelector('#eaExample2').value.trim(),published:document.querySelector('#eaPublished').checked};
 try{eaStatus('Kaydediliyor…');await eaRequest('/rest/v1/Vocabulary'+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(id?obj:[obj])});await eaList();await eaLoad();teacherRender();eaStatus('Kaydedildi.')}catch(e){if(e.message.toLowerCase().includes('jwt')&&await eaRefreshSession())return eaSave(ev);eaStatus('Kaydedilemedi: '+e.message)}}
function eaEdit(id){const x=eaRows.find(x=>x.id===id);if(!x)return;document.querySelector('#eaId').value=x.id;for(const [field,val] of [['eaTheme',x.theme],['eaCategory',x.category],['eaWord',x.word],['eaMeaning',x.meaning],['eaExample1',x.example_1],['eaExample2',x.example_2]])document.getElementById(field).value=val??'';document.querySelector('#eaPublished').checked=!!x.published;document.querySelector('#eaForm').scrollIntoView({behavior:'smooth'})}
async function eaDelete(id){if(!confirm('Bu kelimeyi kalıcı olarak silmek istiyor musunuz?'))return;try{await eaRequest('/rest/v1/Vocabulary?id=eq.'+id,{method:'DELETE'});await eaList();await eaLoad();teacherRender();eaStatus('Silindi.')}catch(e){eaStatus('Silinemedi: '+e.message)}}
function eaLogout(){eaToken='';eaRefresh='';eaRows=[];teacherRender()}
function eaDownload(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function eaTemplate(){eaDownload('english_adventure_template.csv','theme,category,word,meaning,example_1,example_2,published\n2,Classroom Objects,eraser,silgi,I use an ~.,My ~ is pink.,false\n')}
function eaParseCSV(text){const out=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);return out}
async function eaImport(){const file=document.querySelector('#eaCsv').files[0];if(!file){eaStatus('Önce CSV seçin.');return}try{const rows=eaParseCSV((await file.text()).replace(/^\uFEFF/,''));const heads=rows.shift().map(x=>x.trim().toLowerCase());const required=['theme','category','word','meaning'];if(!required.every(x=>heads.includes(x)))throw Error('CSV başlıkları eksik.');const records=rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h,(r[i]||'').trim()]))).filter(x=>x.word&&x.meaning).map(x=>({theme:Number(x.theme),category:x.category,word:x.word,meaning:x.meaning,example_1:x.example_1||'',example_2:x.example_2||'',published:['true','1','yes','evet'].includes((x.published||'').toLowerCase())}));if(records.some(x=>![1,2].includes(x.theme)))throw Error('Tema yalnızca 1 veya 2 olabilir.');if(!records.length)throw Error('Geçerli satır yok.');if(records.length>500)throw Error('Bir defada en fazla 500 satır.');if(!confirm(records.length+' kelime yüklenecek. Devam edilsin mi?'))return;
 for(let i=0;i<records.length;i+=50){eaStatus((i+1)+' / '+records.length+' yükleniyor…');await eaRequest('/rest/v1/Vocabulary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(records.slice(i,i+50))})}await eaList();await eaLoad();teacherRender();eaStatus(records.length+' kelime yüklendi.')}catch(e){eaStatus('Yükleme hatası: '+e.message)}}
eaLoad();setInterval(eaLoad,120000);
</script>
